name: Task
description: One PR-sized piece of work. An agent can pick it up once it is moved to Ready.
labels: ["agent:draft"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The outcome in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable, testable statements. An issue without these isn't ready.
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: test-plan
    attributes:
      label: Test plan
      description: How tests prove each criterion.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this issue must not touch.
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: [XS, S, M, L, XL]
    validations:
      required: true
  - type: input
    id: blocked-by
    attributes:
      label: Blocked by
      description: Issue numbers that must merge first, like "#12, #14".
  - type: dropdown
    id: risk
    attributes:
      label: Risk guess
      description: High if it touches gates, agent config, ADRs, shared/ or dependencies. The risk gate has the final say.
      options: [low, high]
    validations:
      required: true
