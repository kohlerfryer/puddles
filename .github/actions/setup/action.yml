name: setup toolchain
description: Install Python, Node, pnpm and just, then project dependencies from the lockfiles.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v10.4.0
      with:
        python-version: "3.12"
    - uses: pnpm/action-setup@v6
      with:
        package_json_file: game/package.json
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm
        cache-dependency-path: game/pnpm-lock.yaml
    - uses: extractions/setup-just@v4
    - run: uv sync --frozen
      shell: bash
    - run: pnpm -C game install --frozen-lockfile
      shell: bash
