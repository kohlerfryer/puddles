name: nightly bench

# The nightly real-model check (docs/spec/m3-kernel.md §14.1, K19w): runs SmolVLM on CPU over
# ml/bench/photos and compares its replies with the cassettes that PR tests replay. Drift opens or
# updates one issue; it never fails this job, and `main red` only watches `ci`. Dispatch with
# mode=record on a branch to re-record the cassettes on this runner instead and commit them to that
# branch, so the CI CPU runner stays the device the cassettes and the nightly check agree on. That
# commit is pushed with the workflow token, which starts no workflows: push to the branch again so
# `ci` runs before merging. The bot commit has no Co-Authored-By trailer; it isn't an agent commit.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: check the cassettes for drift, or record new ones
        type: choice
        options: [check, record]
        default: check

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-bench
  cancel-in-progress: false

jobs:
  drift:
    name: model drift
    if: inputs.mode != 'record'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - name: Install the vlm group
        run: uv sync --frozen --group vlm
      - name: Compare real replies with the cassettes
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: server
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --frozen --group vlm python -m scripts.model_drift --summary drift.md --run-url "$RUN_URL"
          cat drift.md >> "$GITHUB_STEP_SUMMARY"

  record:
    name: record cassettes
    if: inputs.mode == 'record'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Refuse to record on main or a tag
        if: github.ref_type != 'branch' || github.ref == 'refs/heads/main'
        run: |
          echo "::error::Dispatch mode=record on a branch other than main (got $GITHUB_REF)."
          exit 1
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - name: Install the vlm group
        run: uv sync --frozen --group vlm
      - name: Record the cassettes on this runner and commit them to the branch
        env:
          PYTHONPATH: server
        run: |
          for model in smolvlm smolvlm-json; do
            uv run --frozen --group vlm python -m scripts.cassettes record "$model"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/tests/cassettes/
          if git diff --cached --quiet; then
            echo "Cassettes unchanged: nothing to commit." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Re-record the cassettes on the CI CPU runner"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "Committed new cassettes to $GITHUB_REF_NAME; push again so ci runs." >> "$GITHUB_STEP_SUMMARY"
          fi
