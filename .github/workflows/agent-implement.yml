name: agent implement

# Agents implement ready issues in parallel and open PRs (docs/workflow.md).
# Dispatch runs when the owner labels an issue agent:ready, when the owner or the
# manager routine pushes to main, every 15 minutes, or by hand. claude-code-action
# refuses push events, so a push only re-dispatches this workflow. That run's actor is
# github-actions[bot], so the action must allow that one bot. Auto-merges made by
# github-actions[bot] don't trigger workflows, so those are picked up by the 15-minute run.
# Set the repo variable AGENTS_PAUSED=true to stop agents.

on:
  issues:
    types: [labeled]
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to implement (default: next ready issue)"
        required: false

permissions:
  contents: read

env:
  OWNER: kohlerfryer

jobs:
  redispatch:
    name: re-dispatch after push
    if: vars.AGENTS_PAUSED != 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run agent-implement.yml -R "$GITHUB_REPOSITORY" --ref main

  dispatch:
    name: pick issue
    if: >-
      vars.AGENTS_PAUSED != 'true' && github.event_name != 'push' &&
      (github.event_name != 'issues' ||
       (github.event.label.name == 'agent:ready' && github.event.sender.login == 'kohlerfryer'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: agent-dispatch
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      issues: ${{ steps.pick.outputs.issues }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event.issue.number || inputs.issue }}
        run: |
          uv run --frozen python -m scripts.close_merged
          uv run --frozen python -m scripts.agent_dispatch ${REQUESTED:+--issue "$REQUESTED"} > pick.json
          jq -r .reason pick.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "issues=$(jq -c .issues pick.json)" >> "$GITHUB_OUTPUT"
          for issue in $(jq -r '.issues[]' pick.json); do
            gh issue edit "$issue" -R "$GITHUB_REPOSITORY" --add-label agent:in-progress --remove-label agent:ready
          done

  implement:
    name: implement issue
    needs: dispatch
    if: needs.dispatch.outputs.issues != '[]' && needs.dispatch.outputs.issues != ''
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.dispatch.outputs.issues) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: anthropics/claude-code-action@v1
        env:
          PUDDLES_AGENT: ci
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          allowed_bots: github-actions
          prompt: /work-issue ${{ matrix.issue }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(just:*),Bash(uv:*),Bash(pnpm:*),Read,Edit,Write,Glob,Grep,Skill"
      - name: Escalate when the run fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ matrix.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --add-label needs-human --remove-label agent:in-progress
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "The agent run failed or timed out: $RUN_URL"
