name: agent implement

# An agent implements the next ready issue and opens a PR (docs/workflow.md).
# Starts when the owner labels an issue agent:ready, hourly to pick up queued
# issues, or by hand. Set the repo variable AGENTS_PAUSED=true to stop agents.

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to implement (default: next ready issue)"
        required: false

permissions:
  contents: read

env:
  OWNER: kohlerfryer

jobs:
  dispatch:
    name: pick issue
    if: >-
      vars.AGENTS_PAUSED != 'true' &&
      (github.event_name != 'issues' ||
       (github.event.label.name == 'agent:ready' && github.event.sender.login == 'kohlerfryer'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: agent-dispatch
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      issue: ${{ steps.pick.outputs.issue }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ github.event.issue.number || inputs.issue }}
        run: |
          uv run --frozen python -m scripts.close_merged
          uv run --frozen python -m scripts.agent_dispatch ${REQUESTED:+--issue "$REQUESTED"} > pick.json
          jq -r .reason pick.json | tee -a "$GITHUB_STEP_SUMMARY"
          issue=$(jq -r '.issue // empty' pick.json)
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" -R "$GITHUB_REPOSITORY" --add-label agent:in-progress --remove-label agent:ready
          fi

  implement:
    name: implement issue
    needs: dispatch
    if: needs.dispatch.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: anthropics/claude-code-action@v1
        env:
          PUDDLES_AGENT: ci
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          display_report: true
          prompt: /work-issue ${{ needs.dispatch.outputs.issue }}
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 80
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(just:*),Bash(uv:*),Bash(pnpm:*),Read,Edit,Write,Glob,Grep,Skill"
      - name: Escalate when the run fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ needs.dispatch.outputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --add-label needs-human --remove-label agent:in-progress
          gh issue comment "$ISSUE" -R "$GITHUB_REPOSITORY" --body "The agent run failed or timed out: $RUN_URL"
