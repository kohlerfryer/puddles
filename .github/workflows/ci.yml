name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: game/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - uses: extractions/setup-just@v4
      - run: uv sync --frozen
      - run: pnpm -C game install --frozen-lockfile
      - run: just check
